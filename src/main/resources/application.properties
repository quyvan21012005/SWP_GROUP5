# ===================================================================
# CTMS - Container Terminal Management System Configuration
# ===================================================================
spring.application.name=ctms
server.port=8080

# --- Microsoft SQL Server (Lưu trữ vĩnh viễn trên ổ đĩa, KHÔNG chạy trong RAM) ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ctms_db;encrypt=true;trustServerCertificate=true;
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=1111
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Tắt hoàn toàn H2 Database trong RAM
spring.h2.console.enabled=false

# --- Thymeleaf Caching ---
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --- Logging ---
logging.level.com.ctms=INFO
logging.level.org.springframework.security=WARN
