<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ Thống CTMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-sky-950 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <!-- Logo & Branding -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-sky-400 to-indigo-600 shadow-2xl shadow-sky-500/30 mb-3 border border-sky-300/30">
                <i class="fa-solid fa-anchor text-white text-3xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">CTMS PORT TERMINAL</h1>
            <p class="text-xs text-sky-300 uppercase tracking-widest mt-1 font-semibold">Hệ Thống Quản Lý Khai Thác Cảng Container</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-3xl shadow-2xl p-7 sm:p-9 border border-white/20">
            <div class="mb-6">
                <h2 class="text-lg font-bold text-slate-800">Đăng Nhập</h2>
                <p class="text-xs text-slate-500 mt-0.5">Vui lòng nhập tài khoản và mật khẩu để tiếp tục</p>
            </div>

            <!-- Alerts -->
            <div th:if="${errorMessage}" class="mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation text-rose-500 shrink-0"></i>
                <span th:text="${errorMessage}">Thông tin đăng nhập không chính xác!</span>
            </div>
            <div th:if="${logoutMessage}" class="mb-5 p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-medium flex items-center gap-2">
                <i class="fa-solid fa-circle-check text-emerald-500 shrink-0"></i>
                <span th:text="${logoutMessage}">Đã đăng xuất thành công!</span>
            </div>

            <form th:action="@{/login}" method="post" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Tài Khoản / Số Điện Thoại</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" name="username" id="usernameField" required autofocus placeholder="Nhập tên tài khoản hoặc số điện thoại..."
                               class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-sky-500 focus:outline-none transition">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Mật Khẩu</label>
                        <button type="button" onclick="togglePassword()" class="text-[11px] text-sky-600 hover:text-sky-700 font-semibold cursor-pointer">
                            <i class="fa-solid fa-eye" id="toggleIcon"></i> Hiện
                        </button>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" name="password" id="passwordField" required placeholder="Nhập mật khẩu..."
                               class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-sky-500 focus:outline-none transition">
                    </div>
                </div>

                <div class="pt-3">
                    <button type="submit" class="w-full py-3.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-sm shadow-xl shadow-sky-600/30 transition flex items-center justify-center gap-2 cursor-pointer">
                        <span>Đăng Nhập</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-100 text-center text-[11px] text-slate-400">
                Hệ thống CTMS &bull; Bảo mật thông tin nội bộ
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center text-xs text-slate-500 mt-6">
            CTMS PORT &copy; 2026. Tất cả quyền được bảo lưu.
        </div>
    </div>

    <script>
        function togglePassword() {
            const pwdField = document.getElementById('passwordField');
            const icon = document.getElementById('toggleIcon');
            if (pwdField.type === 'password') {
                pwdField.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                pwdField.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }
    </script>
</body>
</html>
