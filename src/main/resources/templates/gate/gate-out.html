<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: mainLayout(~{::#main-content})}">
<head></head>
<body>
        <div id="main-content" class="max-w-3xl mx-auto space-y-6">

            <!-- Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 bg-gradient-to-r from-rose-600 to-pink-700 text-white">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-white/20 flex items-center justify-center text-2xl">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </div>
                        <div>
                            <h1 class="text-xl font-bold">Thủ Tục Xác Nhận Xe Rời Cổng (Confirm Gate Out)</h1>
                            <p class="text-xs text-rose-100 mt-0.5">Tự động giải phóng vị trí bãi và sinh nhật ký Gate Out</p>
                        </div>
                    </div>
                </div>

                <form th:action="@{/gate/out}" method="post" class="p-6 space-y-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- License Plate -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Biển Số Xe Rời Cổng *</label>
                            <input type="text" name="licensePlate" required placeholder="VD: 51C-889.92"
                                   class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono uppercase font-bold text-slate-800 focus:ring-2 focus:ring-rose-500">
                        </div>

                        <!-- Container Number Selection -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Chọn Container Xuất Cảng (In Yard) *</label>
                            <select name="containerNumber" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono font-bold focus:ring-2 focus:ring-rose-500">
                                <option value="">-- Chọn container trong bãi --</option>
                                <option th:each="c : ${inYardContainers}" th:value="${c.containerNumber}"
                                        th:text="${c.containerNumber} + ' (Slot: ' + (${c.currentSlot != null} ? ${c.currentSlot.slotCode} : 'Chưa gán') + ' - ' + ${c.shippingLine.code} + ')'">
                                </option>
                            </select>
                        </div>

                        <!-- Seal Number Verification -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Kiểm Tra Lại Số Chì Seal *</label>
                            <input type="text" name="sealNumber" required placeholder="VD: SL-99881"
                                   class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono uppercase focus:ring-2 focus:ring-rose-500">
                        </div>

                        <!-- Condition -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Tình Trạng Vỏ Cont Khi Ra Cổng</label>
                            <select name="condition" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-rose-500">
                                <option value="GOOD">Nguyên vẹn (Good)</option>
                                <option value="DAMAGED">Hỏng hóc (Damaged)</option>
                            </select>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                        <a th:href="@{/gate}" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">
                            &larr; Quay lại
                        </a>
                        <button type="submit" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl shadow-lg shadow-rose-600/30 transition flex items-center gap-2">
                            <i class="fa-solid fa-check"></i> Xác Nhận Cho Xe Xuất Cổng (Confirm Gate Out)
                        </button>
                    </div>
                </form>
            </div>

        </div>
</body>
</html>
