<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: mainLayout(~{::#main-content})}">
<head></head>
<body>
        <div id="main-content" class="max-w-3xl mx-auto space-y-6">

            <!-- Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 bg-gradient-to-r from-slate-900 via-slate-800 to-rose-950 text-white">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-rose-500/20 border border-rose-400/30 flex items-center justify-center text-2xl text-rose-400">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </div>
                        <div>
                            <h1 class="text-xl font-bold">Thủ Tục Kiểm Soát Xe Rời Cổng (Gate Out)</h1>
                            <p class="text-xs text-slate-300 mt-0.5">Kiểm tra tình trạng container xuất cảng, giải phóng vị trí bãi và ghi nhận nhật ký Gate Out</p>
                        </div>
                    </div>
                </div>

                <!-- Thông báo Quét QR thành công -->
                <div th:if="${qrVerifiedMessage}" class="bg-indigo-600 text-white p-4 border-b border-indigo-700 flex items-center gap-3 text-xs font-bold">
                    <i class="fa-solid fa-qrcode text-xl text-emerald-300 shrink-0"></i>
                    <span th:text="${qrVerifiedMessage}">Quét QR thành công!</span>
                </div>

                <form th:action="@{/gate/out}" method="post" class="p-6 space-y-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- License Plate -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Biển Số Xe Rời Cổng *</label>
                            <input type="text" name="licensePlate" required
                                   th:value="${app != null ? app.licensePlate : ''}"
                                   placeholder="VD: 51C-889.92"
                                   class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono uppercase font-bold text-slate-800 focus:ring-2 focus:ring-rose-500">
                        </div>

                        <!-- Container Number Selection -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Chọn Container Xuất Cảng (In Yard) *</label>
                            <select name="containerNumber" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono font-bold focus:ring-2 focus:ring-rose-500">
                                <option value="">-- Chọn container trong bãi --</option>
                                <option th:each="c : ${inYardContainers}" th:value="${c.containerNumber}"
                                        th:selected="${(app != null and app.containerNumber == c.containerNumber) or (containerParam != null and containerParam == c.containerNumber)}"
                                        th:text="${c.containerNumber} + ' (Slot: ' + (${c.currentSlot != null} ? ${c.currentSlot.slotCode} : 'Chưa gán') + ' - HQ: ' + (${c.customsClearanceCode != null} ? ${c.customsClearanceCode} : 'Chưa có') + ')'">
                                </option>
                            </select>
                        </div>

                        <!-- Seal Number Verification -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Kiểm Tra Lại Số Chì Seal *</label>
                            <input type="text" name="sealNumber" required
                                   th:value="${app != null ? app.sealNumber : 'SL-99881'}"
                                   placeholder="VD: SL-99881"
                                   class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono uppercase focus:ring-2 focus:ring-rose-500">
                        </div>

                        <!-- Condition -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Tình Trạng Vỏ Cont Khi Ra Cổng</label>
                            <select name="condition" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-rose-500">
                                <option value="GOOD">Nguyên vẹn (Good)</option>
                                <option value="DAMAGED">Hỏng hóc (Damaged)</option>
                            </select>
                        </div>

                        <!-- Customs Clearance Code (Bắt buộc) -->
                        <div class="md:col-span-2 p-4 rounded-xl bg-emerald-50 border border-emerald-300 space-y-2">
                            <label class="block text-xs font-bold text-emerald-900 uppercase tracking-wider flex items-center gap-1.5">
                                <i class="fa-solid fa-file-shield text-emerald-600"></i> Số Giấy Thông Quan Hải Quan Xuất Cổng * (Bắt buộc)
                            </label>
                            <input type="text" name="customsClearanceCode" required
                                   th:value="${app != null and app.customsClearanceCode != null ? app.customsClearanceCode : 'HQ-VNACCS-2026-001'}"
                                   placeholder="VD: HQ-VNACCS-2026-001"
                                   class="w-full p-2.5 bg-white border border-emerald-400 rounded-xl text-xs font-mono font-bold uppercase text-emerald-950 focus:ring-2 focus:ring-emerald-600">
                            <label class="flex items-center gap-2 text-xs text-emerald-800 font-medium pt-1 cursor-pointer">
                                <input type="checkbox" required checked class="rounded text-emerald-600 focus:ring-emerald-500">
                                <span>Đã kiểm tra Giấy thông quan của Hải quan hợp lệ, cho phép tài xế kéo container rời cảng (Gate Out).</span>
                            </label>
                        </div>

                        <!-- Gate Pass QR Code (Chứng minh đã thanh toán) -->
                        <div class="md:col-span-2 p-4 rounded-xl bg-indigo-50 border border-indigo-300 space-y-2">
                            <label class="block text-xs font-bold text-indigo-900 uppercase tracking-wider flex items-center gap-1.5">
                                <i class="fa-solid fa-qrcode text-indigo-600"></i> Mã QR Vé Vào Cổng (Chứng Minh Đã Thanh Toán VietQR) *
                            </label>
                            <input type="text" name="gatePassCode" required
                                   th:value="${app != null and app.gatePassCode != null ? app.gatePassCode : 'QR-PASS-BKIMP2026001-1001'}"
                                   placeholder="VD: QR-PASS-BKIMP2026001-1001"
                                   class="w-full p-2.5 bg-white border border-indigo-400 rounded-xl text-xs font-mono font-bold uppercase text-indigo-950 focus:ring-2 focus:ring-indigo-600">
                            <label class="flex items-center gap-2 text-xs text-indigo-800 font-medium pt-1 cursor-pointer">
                                <input type="checkbox" required checked class="rounded text-indigo-600 focus:ring-indigo-500">
                                <span>Đã quét mã QR xác nhận tài xế đã thanh toán phí nâng hạ cảng (NGUYEN VAN QUY - 0867601156).</span>
                            </label>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                        <a th:href="@{/gate}" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">
                            &larr; Quay lại
                        </a>
                        <button type="submit" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl shadow-lg shadow-rose-600/30 transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-check"></i> Xác Nhận Cho Xe Rời Cổng (Gate Out)
                        </button>
                    </div>
                </form>
            </div>

        </div>
</body>
</html>
