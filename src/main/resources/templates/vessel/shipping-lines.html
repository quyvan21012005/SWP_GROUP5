<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: mainLayout(~{::#main-content})}">
<head></head>
<body>
        <div id="main-content" class="space-y-6" x-data="{ createModal: false }">

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800 tracking-tight flex items-center gap-2">
                        <i class="fa-solid fa-building-flag text-violet-600"></i> Quản Lý Hãng Tàu (Shipping Lines)
                    </h1>
                    <p class="text-sm text-slate-500 mt-1">Danh mục các hãng vận tải biển và đại lý hợp tác với cảng</p>
                </div>
                <button @click="createModal = true" class="px-4 py-2 bg-violet-600 hover:bg-violet-700 text-white text-xs font-semibold rounded-xl transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-plus"></i> Thêm Hãng Tàu Mới
                </button>
            </div>

            <!-- Shipping Lines Cards / Table -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div th:each="line : ${shippingLines}" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
                            <span class="w-12 h-12 rounded-xl bg-violet-50 text-violet-700 font-extrabold flex items-center justify-center font-mono text-base shadow-sm" th:text="${line.code}">MAE</span>
                            <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-semibold">Đối tác tích cực</span>
                        </div>
                        <h3 class="font-bold text-base text-slate-800 mb-2" th:text="${line.name}">Maersk Line</h3>
                        <div class="space-y-1.5 text-xs text-slate-600">
                            <div><i class="fa-solid fa-envelope text-slate-400 w-4"></i> <span th:text="${line.contactEmail}">email</span></div>
                            <div><i class="fa-solid fa-phone text-slate-400 w-4"></i> <span th:text="${line.contactPhone}">phone</span></div>
                            <div><i class="fa-solid fa-location-dot text-slate-400 w-4"></i> <span th:text="${line.address}">address</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CREATE MODAL -->
            <div x-show="createModal" class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
                <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200" @click.away="createModal = false">
                    <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                        <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-plus text-violet-600"></i> Thêm Hãng Tàu Mới
                        </h3>
                        <button @click="createModal = false" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <form th:action="@{/shipping-lines/create}" method="post" class="space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Mã Viết Tắt (Code) *</label>
                                <input type="text" name="code" required placeholder="VD: ONE, HMM..." class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs uppercase font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Tên Hãng Tàu *</label>
                                <input type="text" name="name" required placeholder="VD: Ocean Network Express" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Liên Hệ</label>
                                <input type="email" name="email" placeholder="contact@line.com" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Số Điện Thoại</label>
                                <input type="text" name="phone" placeholder="028-xxxx-xxxx" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Địa Chỉ Văn Phòng</label>
                            <input type="text" name="address" placeholder="Địa chỉ đại lý tại cảng" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs">
                        </div>
                        <div class="pt-2 flex justify-end gap-2">
                            <button type="button" @click="createModal = false" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl">Hủy</button>
                            <button type="submit" class="px-4 py-2 bg-violet-600 hover:bg-violet-700 text-white text-xs font-semibold rounded-xl">Lưu Hãng Tàu</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
</body>
</html>
